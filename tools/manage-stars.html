<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Chrysanthemum Star Manager</title>
<style>
:root{--bg:#070913;--ink:#e8e6f4;--soft:#a9a6c4;--faint:#6f6c8e;--line:rgba(190,180,255,.18);--card:rgba(20,18,44,.9);--rose:#e9a8d0;--lav:#b9a8ff;--ok:#8fe3c0;--warn:#f2c98a;--bad:#ff9fb2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:300 15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
h1{margin:0 auto 0 0;font-weight:200;font-size:17px;letter-spacing:.12em;text-transform:uppercase}
button,select,input{font:inherit;color:var(--ink)}
button{appearance:none;border:1px solid rgba(185,168,255,.5);background:rgba(150,110,255,.28);min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer}
button.quiet{background:transparent;border-color:var(--line);color:var(--soft)}
button.danger{border-color:rgba(255,159,178,.6);background:rgba(255,159,178,.12);color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
select,input[type=password]{background:#12142a;border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 10px;width:100%}
#status{font-size:14px;padding:4px 12px;border-radius:99px;border:1px solid var(--line)}
#status.ok{color:var(--ok);border-color:rgba(143,227,192,.5)}
#status.pend{color:var(--warn);border-color:rgba(242,201,138,.5)}
#status.bad{color:var(--bad);border-color:rgba(255,159,178,.55)}
#msg{padding:6px 12px;font-size:14px;color:var(--soft);border-bottom:1px solid var(--line)}
#msg.bad{color:var(--bad)} #msg.ok{color:var(--ok)}
#work{flex:1;min-height:0;display:flex;position:relative}
#mapwrap{flex:1;min-width:0;position:relative}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:radial-gradient(ellipse at 50% 30%,#10132b,#060710)}
#zoom{position:absolute;left:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px}
#zoom button{min-width:40px;padding:0 10px}
#panel{width:300px;flex:none;border-left:1px solid var(--line);background:var(--card);padding:14px;overflow:auto}
#panel h2{margin:0 0 2px;font-weight:300;font-size:16px;letter-spacing:.06em;color:var(--lav);word-break:break-word}
.fld{margin:12px 0}
.fld label{display:block;color:var(--soft);font-size:13px;margin-bottom:4px}
.tiny{font-size:12.5px;color:var(--faint)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#ov,#login{position:fixed;inset:0;background:rgba(5,6,16,.82);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
#login{z-index:20;background:var(--bg)}
.box{background:#141630;border:1px solid var(--line);border-radius:18px;padding:22px;max-width:420px;width:100%}
.box h2{margin:0 0 8px;font-weight:300;font-size:18px}
.err{color:var(--bad);min-height:1.4em;font-size:14px}
[hidden]{display:none!important}
@media (max-width:700px){#panel{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:52%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0}#zoom{bottom:auto;top:10px}}
</style>
</head>
<body>
<header>
  <h1>✦ Star Manager</h1>
  <span id="status" class="ok" aria-live="polite">Loading…</span>
  <button id="save" disabled>Save changes</button>
  <button id="discard" class="quiet" disabled>Discard all</button>
  <button id="reload" class="quiet">Reload</button>
  <button id="leave" class="quiet">Leave</button>
</header>
<div id="msg" role="status" aria-live="polite"></div>
<div id="work">
  <div id="mapwrap">
    <canvas id="map" aria-label="Star map"></canvas>
    <div id="zoom"><button id="zin" class="quiet" aria-label="Zoom in">+</button><button id="zout" class="quiet" aria-label="Zoom out">−</button><button id="zfit" class="quiet">Fit</button></div>
  </div>
  <aside id="panel" hidden aria-label="Star properties">
    <h2 id="pTitle"></h2>
    <div class="tiny mono" id="pId"></div>
    <div class="tiny" id="pPos"></div>
    <div class="fld"><label for="fType">Star type</label><select id="fType"></select><div class="tiny" id="typeNote"></div></div>
    <div class="fld"><label for="fSize">Size</label><select id="fSize"></select></div>
    <div class="fld"><label for="fColor">Colour</label><select id="fColor"></select></div>
    <div class="fld"><label for="fAura">Aura</label><select id="fAura"></select></div>
    <div class="row"><button id="revert" class="quiet">Revert this star</button><button id="del" class="danger">Delete star…</button></div>
    <p class="tiny">Only appearance and position can be changed here. Memory text, title, photos and audio are never touched.</p>
  </aside>
</div>
<div id="ov" hidden role="dialog" aria-modal="true"><div class="box"><h2 id="ovT"></h2><p id="ovB"></p><div class="row" id="ovBtns"></div></div></div>
<div id="login" hidden>
  <div class="box">
    <h2>Star Manager</h2>
    <p class="tiny">Sign in with the shared password.</p>
    <input type="password" id="pw" placeholder="password" autocomplete="current-password">
    <div class="err" id="pwErr" aria-live="polite"></div>
    <div class="row"><button id="enter">Enter</button></div>
  </div>
</div>

<script type="module">
// Same public Firebase config, auth Worker and session persistence as the main site (index.html / app.js).
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeAuth, browserSessionPersistence, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, query, where, getDocsFromServer, getDocFromServer, runTransaction, writeBatch, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const AUTH_WORKER_URL = "https://chrysanthemum-auth.crysanthemum-1801.workers.dev/";
const firebaseConfig = {
  apiKey: "AIzaSyDN2FxfwLETrQRutjQeS39YN-5gkYgVO1c",
  authDomain: "crysanthemum.firebaseapp.com",
  projectId: "crysanthemum",
  storageBucket: "crysanthemum.firebasestorage.app",
  messagingSenderId: "617658533108",
  appId: "1:617658533108:web:e8323baccc1ffd52e0caa1"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = initializeAuth(app, { persistence: browserSessionPersistence });

const $ = id => document.getElementById(id);
const FIELDS = ["x", "y", "size", "color", "aura", "isCelestial", "birthdayNebula"];
const DEFAULTS = { size: "standard", color: "white", aura: "none", isCelestial: false, birthdayNebula: false };
const OPTS = {
  size: ["standard", "tiny", "big"],
  color: ["white", "blue", "lavender", "rose", "amber"],
  aura: ["none", "halo", "radiant"]
};
const PAL = { white: "235,238,255", blue: "150,185,255", lavender: "185,160,255", rose: "245,170,185", amber: "250,205,140" };
const MSG_WRONG = "the stars don't recognize that.", MSG_WAIT = "too many tries. rest a little, then try again.", MSG_FAILED = "the stars can't be reached right now. try again in a moment.";

let stars = new Map();      // id -> { id, title, link, base, cur }
let skipped = 0, sel = null, saving = false, loading = false, loaded = false, busyOp = false;
let view = { x: 0, y: 0, k: 1 };
let dirtyDraw = true;

const withTimeout = (p, ms) => new Promise((res, rej) => {
  const t = setTimeout(() => rej(Object.assign(new Error("timeout"), { code: "deadline-exceeded" })), ms);
  p.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
});
const errCode = e => e && e.code ? String(e.code).replace(/^firestore\//, "") : "";
const isAuthErr = e => ["permission-denied", "unauthenticated"].includes(errCode(e));
const num = v => typeof v === "number" && Number.isFinite(v);
const r1 = v => Math.round(v * 10) / 10;
function norm(k, v){ return v === undefined || v === null ? DEFAULTS[k] : v; }

function msg(text, cls){ const m = $("msg"); m.textContent = text || ""; m.className = cls || ""; }

/* ───── dirty tracking ───── */
function changes(s){
  const o = {};
  for (const k of FIELDS) if (s.cur[k] !== s.base[k]) o[k] = s.cur[k];
  return o;
}
const dirtyIds = () => [...stars.values()].filter(s => Object.keys(changes(s)).length).map(s => s.id);
let lastFailed = false;
function refreshUI(){
  const n = dirtyIds().length;
  const st = $("status");
  if (saving){ st.textContent = "Saving…"; st.className = "pend"; }
  else if (n){ st.textContent = n + " star" + (n > 1 ? "s" : "") + " with unsaved changes"; st.className = lastFailed ? "bad" : "pend"; }
  else { st.textContent = loaded ? "All changes saved" : "Loading…"; st.className = "ok"; }
  const lock = saving || busyOp || loading;
  $("save").disabled = !n || lock;
  $("discard").disabled = !n || lock;
  $("reload").disabled = lock;
  $("leave").disabled = saving;
  fillPanel();
  dirtyDraw = true;
}

/* ───── sign-in (same flow as app.js) ───── */
function showLogin(){ $("login").hidden = false; $("pw").focus(); }
async function requestCustomToken(password){
  const fail = m => Object.assign(new Error("login-failed"), { chrUserMessage: m });
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 15000);
  let res;
  try {
    res = await fetch(AUTH_WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "login", password }), cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer", signal: ctrl.signal });
  } catch (_) { throw fail(MSG_FAILED); } finally { clearTimeout(timer); }
  if (res.status === 401) throw fail(MSG_WRONG);
  if (res.status === 429) throw fail(MSG_WAIT);
  if (!res.ok) throw fail(MSG_FAILED);
  let data; try { data = await res.json(); } catch (_) { throw fail(MSG_FAILED); }
  if (!data || data.ok !== true || typeof data.customToken !== "string") throw fail(MSG_FAILED);
  return data.customToken;
}
let loginBusy = false;
async function tryEnter(){
  if (loginBusy) return;
  const val = $("pw").value.trim();
  if (!val){ $("pwErr").textContent = MSG_WRONG; return; }
  loginBusy = true; $("enter").disabled = true; $("pwErr").textContent = "";
  try {
    const token = await requestCustomToken(val);
    $("pw").value = "";
    await signInWithCustomToken(auth, token);
    $("login").hidden = true;
    msg(loaded ? "Signed in again. Your pending changes are still here — tap Save changes to retry." : "");
    if (!loaded) load();
  } catch (err){
    $("pwErr").textContent = (err && err.chrUserMessage) || MSG_FAILED;
    if (err && err.chrUserMessage === MSG_WRONG) $("pw").value = "";
  } finally { loginBusy = false; $("enter").disabled = false; }
}
$("enter").onclick = tryEnter;
$("pw").onkeydown = e => { if (e.key === "Enter") tryEnter(); };

/* ───── modal ───── */
function ask(title, body, buttons){
  return new Promise(res => {
    $("ovT").textContent = title; $("ovB").textContent = body;
    const box = $("ovBtns"); box.textContent = "";
    for (const [key, label, cls] of buttons){
      const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls;
      b.onclick = () => { $("ov").hidden = true; res(key); };
      box.appendChild(b);
    }
    $("ov").hidden = false; box.firstChild.focus();
  });
}
const pickFields = b => { const o = {}; for (const k of FIELDS) o[k] = b[k]; return o; };
// Resolves true when it is safe to continue (nothing pending, saved, or explicitly discarded).
async function resolvePending(action){
  if (!dirtyIds().length) return true;
  const c = await ask("Unsaved changes", "You have unsaved changes. Save them before you " + action + ", discard them, or stay here.",
    [["save", "Save"], ["discard", "Discard", "danger"], ["cancel", "Stay", "quiet"]]);
  if (c === "cancel") return false;
  if (c === "discard"){ for (const s of stars.values()) Object.assign(s.cur, pickFields(s.base)); refreshUI(); return true; }
  await save();
  return dirtyIds().length === 0;
}

/* ───── load ───── */
async function load(){
  if (loading) return;
  loading = true; refreshUI(); msg("Loading the latest stars from the server…");
  try {
    const snap = await withTimeout(getDocsFromServer(collection(db, "stars")), 30000);
    const next = new Map(); skipped = 0;
    snap.forEach(d => {
      const v = d.data();
      if (!num(v.x) || !num(v.y)){ skipped++; return; }
      const base = { x: v.x, y: v.y,
        size: norm("size", v.size), color: norm("color", v.color), aura: norm("aura", v.aura),
        isCelestial: v.isCelestial === true, birthdayNebula: v.birthdayNebula === true };
      next.set(d.id, { id: d.id, title: typeof v.title === "string" ? v.title : "", link: typeof v.linkedStarId === "string" ? v.linkedStarId : null, base, cur: pickFields(base) });
    });
    stars = next; loaded = true; lastFailed = false;
    if (sel && !stars.has(sel)) sel = null;
    fit();
    msg(stars.size + " stars loaded" + (skipped ? " (" + skipped + " without a valid position are not shown and are untouched)" : "") + ".", "ok");
  } catch (e){
    if (isAuthErr(e)){ showLogin(); msg("Your session ended. Sign in again.", "bad"); }
    else msg("Couldn't load stars (" + (errCode(e) || "error") + "). " + (loaded ? "The stars shown may be out of date; nothing was changed." : "Tap Reload to try again."), "bad");
  } finally { loading = false; refreshUI(); }
}

/* ───── save ───── */
async function save(){
  if (saving || busyOp) return;
  const ids = dirtyIds(); if (!ids.length) return;
  saving = true; lastFailed = false; refreshUI(); msg("");
  let ok = 0, conflict = 0, missing = 0, other = 0, auth401 = false;
  for (const id of ids){
    const s = stars.get(id); const ch = changes(s);
    if (!Object.keys(ch).length) continue;
    try {
      await withTimeout(runTransaction(db, async tx => {
        const ref = doc(db, "stars", id);
        const snap = await tx.get(ref);
        if (!snap.exists()) throw { code: "chr/missing" };
        const d = snap.data();
        for (const k of Object.keys(ch)){
          const sv = k === "isCelestial" || k === "birthdayNebula" ? d[k] === true : norm(k, d[k]);
          if (sv !== ch[k] && sv !== s.base[k]) throw { code: "chr/conflict" };   // changed elsewhere since loaded
        }
        tx.update(ref, ch);                                                       // only the changed fields
      }), 20000);
      Object.assign(s.base, ch); ok++;
    } catch (e){
      const c = errCode(e);
      if (c === "chr/conflict") conflict++; else if (c === "chr/missing") missing++; else { other++; if (isAuthErr(e)) auth401 = true; }
    }
  }
  saving = false; lastFailed = conflict + missing + other > 0;
  const parts = [];
  if (ok) parts.push(ok + " saved");
  if (conflict) parts.push(conflict + " not saved: changed elsewhere since loading (revert that star, or Reload)");
  if (missing) parts.push(missing + " not saved: star no longer exists (Reload)");
  if (other) parts.push(other + " not saved: " + (auth401 ? "session ended, sign in again" : "connection or server problem") + ". Pending changes are kept; tap Save changes to retry");
  msg(parts.join(". ") + ".", lastFailed ? "bad" : "ok");
  refreshUI();
  if (auth401) showLogin();
}
$("save").onclick = save;
$("discard").onclick = async () => {
  if (await ask("Discard all changes?", "All unsaved position and appearance changes will be lost.", [["y", "Discard", "danger"], ["n", "Keep", "quiet"]]) === "y"){
    for (const s of stars.values()) Object.assign(s.cur, pickFields(s.base));
    lastFailed = false; msg("Unsaved changes discarded."); refreshUI();
  }
};
$("reload").onclick = async () => { if (await resolvePending("reload")) load(); };
let allowLeave = false;
$("leave").onclick = async () => { if (await resolvePending("leave")){ allowLeave = true; location.href = "../"; } };
addEventListener("beforeunload", e => { if (!allowLeave && dirtyIds().length){ e.preventDefault(); e.returnValue = ""; } });

/* ───── delete ───── */
$("del").onclick = async () => {
  const s = stars.get(sel); if (!s || saving || busyOp) return;
  const name = s.title ? "“" + s.title + "”" : "this untitled star";
  const c = await ask("Delete " + name + "?", "This permanently removes this one star and its constellation links. Connected stars stay as they are. Photos and audio files are not deleted. This cannot be undone.",
    [["n", "Keep star", "quiet"], ["y", "Delete star", "danger"]]);
  if (c !== "y") return;
  busyOp = true; refreshUI(); msg("Deleting…");
  const id = s.id;
  try {
    const refs = await withTimeout(getDocsFromServer(query(collection(db, "stars"), where("linkedStarId", "==", id))), 20000);
    const batch = writeBatch(db);
    const unlinked = [];
    refs.forEach(d => { if (d.id !== id){ batch.update(d.ref, { linkedStarId: deleteField() }); unlinked.push(d.id); } });
    batch.delete(doc(db, "stars", id));
    await withTimeout(batch.commit(), 20000);
    finishDelete(id, unlinked);
  } catch (e){
    let gone = false;
    try { gone = !(await withTimeout(getDocFromServer(doc(db, "stars", id)), 15000)).exists(); } catch (_) {}
    if (gone) finishDelete(id, null);
    else {
      msg(isAuthErr(e) ? "Not deleted: your session ended. Sign in again and retry." : "Not deleted (" + (errCode(e) || "error") + "). Nothing was changed.", "bad");
      if (isAuthErr(e)) showLogin();
    }
  } finally { busyOp = false; refreshUI(); }
};
function finishDelete(id, unlinked){
  stars.delete(id);
  for (const s of stars.values()) if (s.link === id || (unlinked && unlinked.includes(s.id))) s.link = null;
  if (sel === id) sel = null;
  msg("Star deleted." + (unlinked === null ? " Its links to other stars may still need a Reload to refresh." : ""), "ok");
}

/* ───── panel ───── */
function typeOf(c){ return c.isCelestial && c.birthdayNebula ? "both" : c.isCelestial ? "celestial" : c.birthdayNebula ? "nebula" : "standard"; }
function fillSel(el, list, val){
  el.textContent = "";
  const all = list.includes(val) ? list : [...list, val];
  for (const v of all){ const o = document.createElement("option"); o.value = v; o.textContent = list.includes(v) ? v : v + " (legacy)"; el.appendChild(o); }
  el.value = val;
}
function fillPanel(){
  const s = stars.get(sel);
  $("panel").hidden = !s;
  if (!s) return;
  $("pTitle").textContent = s.title || "Untitled star";
  $("pId").textContent = s.id;
  $("pPos").textContent = "x " + r1(s.cur.x) + " · y " + r1(s.cur.y) + (Object.keys(changes(s)).length ? " · unsaved" : "");
  const types = ["standard", "celestial", "nebula"];
  if (typeOf(s.base) === "both") types.push("both");
  $("fType").textContent = "";
  for (const v of types){ const o = document.createElement("option"); o.value = v; o.textContent = { standard: "standard", celestial: "celestial", nebula: "birthday nebula", both: "celestial + nebula (legacy)" }[v]; $("fType").appendChild(o); }
  $("fType").value = typeOf(s.cur);
  fillSel($("fSize"), OPTS.size, s.cur.size); fillSel($("fColor"), OPTS.color, s.cur.color); fillSel($("fAura"), OPTS.aura, s.cur.aura);
  const lock = saving || busyOp;
  for (const id of ["fType", "fColor", "fAura", "del"]) $(id).disabled = lock;
  $("fSize").disabled = lock || s.cur.isCelestial;
  $("typeNote").textContent = s.cur.isCelestial ? "Celestial stars are always drawn at their own large size; the size setting is ignored." : "A star is standard, celestial or a birthday nebula.";
  $("revert").disabled = lock || !Object.keys(changes(s)).length;
}
function setProp(k, v){ const s = stars.get(sel); if (!s) return; s.cur[k] = v; refreshUI(); }
$("fType").onchange = e => {
  const s = stars.get(sel); if (!s) return; const v = e.target.value;
  if (v === "both"){ s.cur.isCelestial = true; s.cur.birthdayNebula = true; }
  else { s.cur.isCelestial = v === "celestial"; s.cur.birthdayNebula = v === "nebula"; }
  refreshUI();
};
$("fSize").onchange = e => setProp("size", e.target.value);
$("fColor").onchange = e => setProp("color", e.target.value);
$("fAura").onchange = e => setProp("aura", e.target.value);
$("revert").onclick = () => { const s = stars.get(sel); if (s){ Object.assign(s.cur, pickFields(s.base)); refreshUI(); } };

/* ───── map ───── */
const cv = $("map"), cx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
function resize(){ dpr = devicePixelRatio || 1; const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr)); dirtyDraw = true; }
addEventListener("resize", resize);
const w2s = (x, y) => [x * view.k + view.x, y * view.k + view.y];
const s2w = (x, y) => [(x - view.x) / view.k, (y - view.y) / view.k];
function fit(){
  if (!W) resize();
  const a = [...stars.values()];
  if (!a.length){ view = { x: W / 2, y: H / 2, k: 1 }; dirtyDraw = true; return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of a){ x0 = Math.min(x0, s.cur.x); x1 = Math.max(x1, s.cur.x); y0 = Math.min(y0, s.cur.y); y1 = Math.max(y1, s.cur.y); }
  const pad = 50, k = Math.min((W - pad * 2) / Math.max(1, x1 - x0), (H - pad * 2) / Math.max(1, y1 - y0), 4);
  view.k = Math.max(k, 0.001); view.x = W / 2 - (x0 + x1) / 2 * view.k; view.y = H / 2 - (y0 + y1) / 2 * view.k; dirtyDraw = true;
}
function zoomAt(px, py, f){
  const k = Math.min(Math.max(view.k * f, 0.0005), 200);
  const [wx, wy] = s2w(px, py); view.k = k; view.x = px - wx * k; view.y = py - wy * k; dirtyDraw = true;
}
$("zin").onclick = () => zoomAt(W / 2, H / 2, 1.4);
$("zout").onclick = () => zoomAt(W / 2, H / 2, 1 / 1.4);
$("zfit").onclick = fit;
const radius = s => Math.min(11, 3.6 * (s.cur.isCelestial ? 2.2 : s.cur.size === "tiny" ? 0.6 : s.cur.size === "big" ? 2.2 : 1));

function draw(){
  dirtyDraw = false;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
  cx.strokeStyle = "rgba(180,195,255,.22)"; cx.lineWidth = 1;
  for (const s of stars.values()){
    const p = s.link && stars.get(s.link);
    if (!p || (p.link === s.id && s.id > p.id)) continue;
    const a = w2s(s.cur.x, s.cur.y), b = w2s(p.cur.x, p.cur.y);
    cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke();
  }
  for (const s of stars.values()){
    const [x, y] = w2s(s.cur.x, s.cur.y);
    if (x < -40 || y < -40 || x > W + 40 || y > H + 40) continue;
    const c = PAL[s.cur.color] || PAL.white, r = radius(s), changed = Object.keys(changes(s)).length > 0;
    const g = cx.createRadialGradient(x, y, 0, x, y, r * 3.2);
    g.addColorStop(0, "rgba(" + c + ",.45)"); g.addColorStop(1, "rgba(" + c + ",0)");
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 3.2, 0, 6.2832); cx.fill();
    cx.fillStyle = "rgb(" + c + ")"; cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();
    cx.strokeStyle = "rgba(" + c + ",.7)"; cx.lineWidth = 1;
    if (s.cur.aura === "halo"){ cx.beginPath(); cx.arc(x, y, r + 5, 0, 6.2832); cx.stroke(); }
    if (s.cur.aura === "radiant"){ cx.beginPath(); cx.moveTo(x - r - 8, y); cx.lineTo(x + r + 8, y); cx.moveTo(x, y - r - 8); cx.lineTo(x, y + r + 8); cx.stroke(); }
    if (s.cur.isCelestial){ cx.beginPath(); for (let i = 0; i < 6; i++){ const a = i * 1.0472; cx.moveTo(x, y); cx.lineTo(x + Math.cos(a) * (r + 9), y + Math.sin(a) * (r + 9)); } cx.stroke(); }
    if (s.cur.birthdayNebula){ cx.setLineDash([3, 3]); cx.beginPath(); cx.arc(x, y, r + 14, 0, 6.2832); cx.stroke(); cx.setLineDash([]); }
    if (changed){ cx.fillStyle = "#f2c98a"; cx.beginPath(); cx.arc(x + r + 3, y - r - 3, 2.5, 0, 6.2832); cx.fill(); }
    if (s.id === sel){ cx.strokeStyle = "#fff"; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(x, y, r + 7, 0, 6.2832); cx.stroke(); }
  }
}
(function loop(){ if (dirtyDraw) draw(); requestAnimationFrame(loop); })();

function hit(px, py){
  let best = null, bd = 18 * 18;
  for (const s of stars.values()){
    const [x, y] = w2s(s.cur.x, s.cur.y), d = (x - px) ** 2 + (y - py) ** 2;
    if (d <= bd){ bd = d; best = s; }
  }
  return best;
}
const ptrs = new Map(); let drag = null, pinch = null, moved = false;
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  const [px, py] = pos(e); ptrs.set(e.pointerId, [px, py]); moved = false;
  if (ptrs.size === 2){
    drag = null; const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1 }; return;
  }
  const s = !saving && !busyOp ? hit(px, py) : null;
  if (s){
    if (sel !== s.id){ sel = s.id; refreshUI(); }
    const [wx, wy] = s2w(px, py);
    drag = { type: "star", id: s.id, ox: s.cur.x - wx, oy: s.cur.y - wy };
  } else drag = { type: "pan", lx: px, ly: py };
});
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const [px, py] = pos(e); ptrs.set(e.pointerId, [px, py]); moved = true;
  if (pinch && ptrs.size >= 2){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
    zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / pinch.d); pinch.d = d; return;
  }
  if (!drag) return;
  if (drag.type === "pan"){ view.x += px - drag.lx; view.y += py - drag.ly; drag.lx = px; drag.ly = py; dirtyDraw = true; }
  else { const s = stars.get(drag.id); if (s && !saving){ const [wx, wy] = s2w(px, py); s.cur.x = wx + drag.ox; s.cur.y = wy + drag.oy; dirtyDraw = true; } }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && drag.type === "star"){ const s = stars.get(drag.id); if (s){ s.cur.x = r1(s.cur.x); s.cur.y = r1(s.cur.y); } refreshUI(); }
  else if (drag && drag.type === "pan" && !moved && sel){ sel = null; refreshUI(); }
  if (!ptrs.size) drag = null;
}
cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("wheel", e => { e.preventDefault(); const [px, py] = pos(e); zoomAt(px, py, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });

/* ───── start ───── */
resize(); refreshUI();
(async () => {
  try {
    await auth.authStateReady();
    if (!auth.currentUser){ showLogin(); msg(""); return; }
    await auth.currentUser.getIdToken(true);     // fails if the session was revoked/expired
    load();
  } catch (_) { showLogin(); }
})();
</script>
