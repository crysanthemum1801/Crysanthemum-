<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#060710" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>Chrysanthemum</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ─── PASSWORD SCREEN ─── -->
  <div id="password-screen">
    <canvas id="bg-canvas"></canvas>
    <div class="password-container">
      <p class="caption">a world with you</p>
      <h1 class="title">Chrysanthemum</h1>
      <div class="input-wrapper">
        <input
          type="password"
          id="password-input"
          placeholder="enter the password"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
        <button id="enter-btn" aria-label="Enter">&#8594;</button>
      </div>
      <p id="password-error" class="error-msg" aria-live="polite"></p>
    </div>
  </div>

  <!-- ─── UNIVERSE SCREEN ─── -->
  <div id="universe-screen" class="hidden">
    <canvas id="universe-canvas"></canvas>

    <!-- Top bar -->
    <div id="top-bar">
      <span class="universe-title">Chrysanthemum</span>
      <span id="star-count" class="star-count-badge">0 memories</span>
    </div>

    <!-- Hint -->
    <div id="hint-bar">hold to plant a memory</div>

    <!-- Long-press ripple -->
    <div id="press-ripple" class="hidden"></div>
  </div>

  <!-- ─── MEMORY MODAL ─── -->
  <div id="memory-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
      <div class="modal-star-icon">&#9733;</div>
      <h2 id="modal-title" class="modal-title"></h2>
      <p id="modal-date" class="modal-date"></p>
      <p id="modal-memory" class="modal-memory"></p>
      <p id="modal-creator" class="modal-creator"></p>
      <!-- Media (photo / voice note), filled by media.js -->
      <div id="modal-media" class="modal-media"></div>
      <!-- V2: binary link button -->
      <button id="binary-link-btn" class="btn-binary hidden">create binary link</button>
    </div>
  </div>

  <!-- ─── CREATION MODAL ─── -->
  <div id="creation-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="creation-heading">
    <div class="modal-backdrop"></div>
    <div class="modal-card creation-card">
      <button class="modal-close" id="creation-close-btn" aria-label="Close">&times;</button>
      <div class="modal-star-icon birth-icon">&#9728;</div>
      <h2 id="creation-heading" class="modal-title">a new star is about to be born.</h2>
      <p class="modal-subtitle">this memory will live here forever.</p>

      <div class="field-group">
        <label for="input-memory">memory <span class="required">*</span></label>
        <textarea id="input-memory" placeholder="write what you want to remember…" rows="4" maxlength="50000"></textarea>
        <span class="char-count" id="memory-char-count">0 / 50000</span>
      </div>

      <div class="field-group">
        <label for="input-title">title <span class="optional">(optional)</span></label>
        <input type="text" id="input-title" placeholder="name this memory…" maxlength="60" />
      </div>

      <div class="field-group">
        <label for="input-creator">from <span class="optional">(optional)</span></label>
        <input type="text" id="input-creator" placeholder="who is planting this star…" maxlength="40" />
      </div>

      <!-- V2: size, color, aura row -->
      <div class="field-row-v2">
        <div class="field-group field-group-sm">
          <label for="input-size">size</label>
          <select id="input-size">
            <option value="standard" selected>standard</option>
            <option value="tiny">tiny</option>
            <option value="big">big</option>
          </select>
        </div>
        <div class="field-group field-group-sm">
          <label for="input-color">color</label>
          <select id="input-color">
            <option value="white" selected>white</option>
            <option value="blue">blue</option>
            <option value="lavender">lavender</option>
            <option value="rose">rose</option>
            <option value="amber">amber</option>
          </select>
        </div>
        <div class="field-group field-group-sm">
          <label for="input-aura">aura</label>
          <select id="input-aura">
  <option value="none" selected>none</option>
  <option value="halo">halo</option>
  <option value="radiant">radiant</option>
</select>
        </div>
      </div>

      <!-- V3.2: celestial toggle -->
      <div class="field-group celestial-toggle-group">
        <label class="celestial-checkbox-label">
          <input type="checkbox" id="input-celestial" />
          <span>mark as celestial memory</span>
        </label>
      </div>

      <!-- Birthday Nebula toggle -->
      <div class="field-group birthday-nebula-toggle-group">
        <label class="celestial-checkbox-label">
          <input type="checkbox" id="input-birthday-nebula" />
          <span>add birthday nebula</span>
        </label>
      </div>

      <!-- Media: optional photos and voice notes (up to 3 per star, any mix) -->
      <div class="field-group media-fields">
        <span class="media-heading">attachments <span class="optional">(optional · up to 3)</span></span>
        <div class="media-actions">
          <label class="media-act" for="input-photo">
            <input type="file" id="input-photo" class="sr-file" accept="image/jpeg,image/png,image/webp" multiple />
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 4.5h12a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3z"/><path d="M10.5 8.2a3.2 3.2 0 1 0 3.3 4.6 2.6 2.6 0 0 1-3.3-4.6z"/><path d="M16.5 7.3v2.4M15.3 8.5h2.4"/></svg>
            <span>photos</span>
          </label>
          <label class="media-act" for="input-audio">
            <input type="file" id="input-audio" class="sr-file" accept="audio/*" multiple />
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 10.4a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2z"/><path d="M8.6 8.6a4.8 4.8 0 0 0 0 6.8M15.4 8.6a4.8 4.8 0 0 1 0 6.8M5.6 5.8a9 9 0 0 0 0 12.4M18.4 5.8a9 9 0 0 1 0 12.4"/></svg>
            <span>voice note</span>
          </label>
          <button type="button" id="record-audio-btn" class="media-act" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><circle class="rec-dot" cx="12" cy="12" r="3"/></svg>
            <span id="record-audio-label">record</span>
          </button>
        </div>
        <ul id="media-tray" class="media-tray" aria-label="selected attachments"></ul>
        <p id="media-status" class="error-msg" aria-live="polite"></p>
      </div>

      <p id="creation-error" class="error-msg" aria-live="polite"></p>

      <button id="create-star-btn" class="btn-primary">
        <span id="create-btn-text">plant this star</span>
        <span id="create-btn-loader" class="btn-loader hidden">&#10022;</span>
      </button>
    </div>
  </div>

  <!-- ─── OVERLAP TOAST ─── -->
  <div id="overlap-toast" class="toast hidden" role="alert" aria-live="assertive">
    this region of space is already occupied.
  </div>

  <!-- Firebase SDK (CDN, no build tools) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      initializeAuth,
      browserSessionPersistence,
      signInWithCustomToken,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      serverTimestamp,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ─────────────────────────────────────────────
    //  FIREBASE CONFIG — paste your config here
    //  Replace ALL values below with your own from
    //  Firebase Console → Project Settings → Your apps
    // ─────────────────────────────────────────────
    const firebaseConfig = {
      apiKey:            "AIzaSyDN2FxfwLETrQRutjQeS39YN-5gkYgVO1c",
      authDomain:        "crysanthemum.firebaseapp.com",
      projectId:         "crysanthemum",
      storageBucket:     "crysanthemum.firebasestorage.app",
      messagingSenderId: "617658533108",
      appId:             "1:617658533108:web:e8323baccc1ffd52e0caa1"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // Firebase Authentication. The sign-in itself happens in app.js (password → Worker → custom token).
    // Persistence: browserSessionPersistence keeps the sign-in across page refreshes in this tab only;
    // closing the tab/browser ends it and the password is asked again (same as before).
    // For "stay signed in on this device", change it to browserLocalPersistence (import it above too).
    const auth = initializeAuth(app, { persistence: browserSessionPersistence });

    // Make db and Firestore helpers available globally so app.js can use them
    window._firebase = {
      db,
      auth,
      signInWithCustomToken,
      signOut,
      collection,
      addDoc,
      onSnapshot,
      serverTimestamp,
      query,
      orderBy
    };

    // Signal that Firebase is ready
    window.dispatchEvent(new Event("firebase-ready"));
  </script>

  <script src="media.js"></script>
  <script src="app.js"></script>

  <!-- PWA: service worker registration (after app scripts; does not affect Firebase/app init order) -->
  <script>
    (function () {
      if (!("serviceWorker" in navigator) || window.__swRegistering) return;
      window.__swRegistering = true;

      // Only swap in a waiting worker when nothing is being created/uploaded. No page reload is ever forced.
      function appIsIdle() {
        var modal  = document.getElementById("creation-modal");
        var loader = document.getElementById("create-btn-loader");
        var modalOpen = modal && !modal.classList.contains("hidden");
        var busy = loader && !loader.classList.contains("hidden");
        return !modalOpen && !busy;
      }
      function activateIfIdle(reg) {
        if (reg.waiting && navigator.serviceWorker.controller && appIsIdle()) {
          reg.waiting.postMessage({ type: "SKIP_WAITING" });
        }
      }

      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js", { scope: "./", updateViaCache: "none" })
          .then(function (reg) {
            activateIfIdle(reg);
            reg.addEventListener("updatefound", function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener("statechange", function () {
                if (nw.state === "installed") activateIfIdle(reg);
              });
            });
          })
          .catch(function (err) {
            console.warn("Service worker registration failed (the app works normally without it):", err);
          });
      });
    })();
  </script>
</body>
</html>
